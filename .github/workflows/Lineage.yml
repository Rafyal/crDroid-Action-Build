name: LineageOS 19.1 Images (X663)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Partition Image Target'
        required: true
        default: 'all-images'
        type: choice
        options:
          - all-images
          - bootimage
          - vendorimage
          - systemimage
          - dtboimage
      tree_branch:
        description: 'Branch for ALBINsRAJ2025 repos (leave empty for default branch)'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build LineageOS 19.1 (\${{ github.event.inputs.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Environment & Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core git-lfs gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Add 16GB Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Initialize & Sync LineageOS 19.1
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          git config --global user.name "Rafyal"
          git config --global user.email "rafyal991@gmail.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --depth=1 --git-lfs

          for i in {1..5}; do
            echo "Sync attempt \$i..."
            if timeout 40m repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune; then
              echo "Sync completed!"
              break
            else
              echo "Sync interrupted, retrying in 5s..."
              sleep 5
            fi
          done

      - name: Clone Friend's Device, Vendor & Kernel Trees
        env:
            TREE_BRANCH: ${{ github.event.inputs.tree_branch }}
          run: |
            cd ~/lineage
            if [ -n "$TREE_BRANCH" ]; then
              git clone --depth=1 -b "$TREE_BRANCH" https://github.com/ALBINsRAJ2025/android_device_infinix_X663.git device/infinix/X663
              git clone --depth=1 -b "$TREE_BRANCH" https://github.com/ALBINsRAJ2025/android_vendor_infinix_X663.git vendor/infinix/X663
              git clone --depth=1 -b "$TREE_BRANCH" https://github.com/ALBINsRAJ2025/android_kernel_infinix_X663.git device/infinix/X663-kernel
            else
              git clone --depth=1 https://github.com/ALBINsRAJ2025/android_device_infinix_X663.git device/infinix/X663
              git clone --depth=1 https://github.com/ALBINsRAJ2025/android_vendor_infinix_X663.git vendor/infinix/X663
              git clone --depth=1 https://github.com/ALBINsRAJ2025/android_kernel_infinix_X663.git device/infinix/X663-kernel
            fi
            (cd device/infinix/X663-kernel && git lfs pull || true)
          
      - name: Auto-Configure Kernel Path & Lineage Product Makefiles
        run: |
                cd ~/lineage
      
                echo "=== 1. Inspect Tree Layout ==="
                ls -la device/infinix/X663
                grep -rnE "TARGET_PREBUILT_KERNEL|TARGET_KERNEL_SOURCE|COMMON_LUNCH_CHOICES|PRODUCT_NAME" device/infinix/X663/ || true
      
                echo "=== 2. Match Kernel Directory Expected by BoardConfig.mk ==="
                KERNEL_PATH=\$(grep -E "TARGET_PREBUILT_KERNEL|TARGET_KERNEL_SOURCE" device/infinix/X663/BoardConfig.mk | head -n 1 | awk -F':=' '{print \$2}' | xargs)
                echo "Detected kernel path in BoardConfig.mk: \$KERNEL_PATH"
                if [[ "\$KERNEL_PATH" == kernel/infinix/* ]]; then
                  TARGET_DIR=$(dirname "$KERNEL_PATH")
                  mkdir -p "$(dirname "$TARGET_DIR")"
                  ln -sfn "$PWD/device/infinix/X663-kernel" "$TARGET_DIR"
                  echo "Linked device/infinix/X663-kernel -> \$TARGET_DIR"
                fi
      
                echo "=== 3. Ensure lineage_X663 Target Exists ==="
                if [ ! -f device/infinix/X663/lineage_X663.mk ]; then
                  ORIG_MK=\$(find device/infinix/X663 -maxdepth 1 -name "*_X663.mk" | head -n 1)
                  if [ -n "\$ORIG_MK" ]; then
                    OLD_PREFIX=$(basename "$ORIG_MK" _X663.mk)
                    echo "Converting \${OLD_PREFIX}_X663.mk -> lineage_X663.mk"
                    cp "\$ORIG_MK" device/infinix/X663/lineage_X663.mk
                    sed -i "s/${OLD_PREFIX}_X663/lineage_X663/g; s/vendor\/${OLD_PREFIX}/vendor\/lineage/g" device/infinix/X663/lineage_X663.mk
                    sed -i "s/\${OLD_PREFIX}_X663/lineage_X663/g" device/infinix/X663/AndroidProducts.mk
                  fi
                fi
      
                echo "=== 4. Check If Extra MediaTek Hardware Repos Are Referenced ==="
                if grep -rq "hardware/mediatek" device/infinix/X663 vendor/infinix/X663; then
                  if [ ! -d hardware/mediatek ]; then
                    git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_hardware_mediatek.git hardware/mediatek || true
                  fi
                fi

      - name: Compile Partition Images
        run: |
          cd ~/lineage
          source build/envsetup.sh
          lunch lineage_X663-userdebug

          echo "=== Reclaim ~45GB Before Compiling ==="
          rm -rf .repo/
          rm -rf prebuilts/clang/host/darwin-x86 prebuilts/clang/host/windows-x86
          rm -rf prebuilts/
