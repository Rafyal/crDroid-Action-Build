name: crDroid Build (Free Tier Survival)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Membajak Ruang Penyimpanan (Free Disk Space)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize & Sync crDroid (Core System)
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "Rafyal"
          git config --global user.email "rafyal991@gmail.com"
          repo init -u https://github.com/crdroidandroid/android.git -b 12.1 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

      - name: Clone Device, Vendor, Kernel & crDroid Vendor Trees
        run: |
          cd ~/crdroid
          # Hapus versi sebelumnya yang salah cabang
          rm -rf vendor/crdroid
          
          # Kloning Tree Perangkatmu
          git clone --depth=1 https://github.com/Rafyal/android_device_infinix_x663.git device/infinix/X663
          git clone --depth=1 https://github.com/Rafyal/android_vendor_infinix_x663.git vendor/infinix/X663
          git clone --depth=1 https://github.com/Rafyal/android_kernel_infinix_x663.git device/infinix/X663-kernel
          
          # Kloning vendor crDroid khusus basis Android 12.1
          git clone --depth=1 -b 12.1 https://github.com/crdroidandroid/android_vendor_crdroid.git vendor/crdroid
      - name: Build ROM
        run: |
          set +e
          cd ~/crdroid
          
          # TRIK ULTIMATE: Hapus instruksi kompilasi di folder lineage
          # Ini akan membuat folder lineage "tak kasat mata" oleh mesin kompilasi, 
          # tapi file konfigurasinya tetap bisa dibaca oleh perintah lunch.
          find vendor/lineage -type f -name "Android.bp" -delete
          find vendor/lineage -type f -name "Android.mk" -delete
          
          source build/envsetup.sh
          
          echo "=== EKSEKUSI LUNCH ==="
          lunch crdroid_X663-userdebug
          
          echo "=== MULAI KOMPILASI ==="
          mka bacon
      
          
      - name: Upload Output ROM ZIP
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-X663-ROM
          path: ~/crdroid/out/target/product/X663/crDroidAndroid-*.zip
