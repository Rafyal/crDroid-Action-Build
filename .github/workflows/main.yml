name: crDroid Build (Free Tier Survival)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Membajak Ruang Penyimpanan (Free Disk Space)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize & Sync crDroid (Core System)
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "Rafyal"
          git config --global user.email "rafyal991@gmail.com"
          repo init -u https://github.com/crdroidandroid/android.git -b 12.1 --depth=1
          
          echo "=== MEMULAI SINKRONISASI (ANTI-ZOMBIE MODE) ==="
          # Percobaan ke-1: Beri batas waktu maksimal 45 menit. Jika nyangkut (RTO), bunuh paksa.
          timeout 45m repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune || echo "Koneksi nyangkut/RTO! Memulai ulang sinkronisasi sisa file..."
          
          # Percobaan ke-2: Lanjutkan sisa unduhan yang terputus dengan batas waktu 30 menit.
          timeout 30m repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune || true

      - name: Clone Device, Vendor, Kernel & crDroid Vendor Trees
        run: |
          cd ~/crdroid
          # Hapus versi sebelumnya yang salah cabang
          rm -rf vendor/crdroid
          
          # Kloning Tree Perangkatmu
          git clone --depth=1 https://github.com/Rafyal/android_device_infinix_x663.git device/infinix/X663
          git clone --depth=1 https://github.com/Rafyal/android_vendor_infinix_x663.git vendor/infinix/X663
          git clone --depth=1 https://github.com/Rafyal/android_kernel_infinix_x663.git device/infinix/X663-kernel
          
          # Kloning vendor crDroid khusus basis Android 12.1
          git clone --depth=1 -b 12.1 https://github.com/crdroidandroid/android_vendor_crdroid.git vendor/crdroid
      - name: Membajak Ruang Penyimpanan (Free Disk Space)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false  # Sangat krusial agar swap bawaan tidak dihapus

      - name: Memompa RAM Virtual (Swap 8GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Build ROM
        run: |
          set +e
          cd ~/crdroid
          
          echo "=== PEMBERSIHAN KONFLIK TOTAL & REVERSE STRATEGY ==="
          # Hapus Soong dan charger Lineage
          rm -rf vendor/lineage/build/soong
          rm -rf vendor/lineage/charger
          rm -f vendor/lineage/prebuilt/common/Android.mk
          
          # Hapus tes Bluetooth
          sed -i '/BluetoothInstrumentationTests/d' platform_testing/build/tasks/tests/instrumentation_test_list.mk || true
          
          # Hancurkan task crDroid yang cacat, pertahankan milik Lineage
          for file in vendor/lineage/build/tasks/*.mk; do
              filename=$(basename "$file")
              if [ -f "vendor/crdroid/build/tasks/$filename" ]; then
                  rm -f "vendor/crdroid/build/tasks/$filename"
              fi
          done
          
          echo "=== PATCH SOONG & HARDCODE VARIABEL ==="
          # Patch overlay Lineage
          sed -i 's/name: "sensitive_pn.xml"/name: "sensitive_pn_lineage.xml"/g' vendor/lineage/prebuilt/common/Android.bp || true
          sed -i 's/name: "NetworkStackOverlay"/name: "NetworkStackOverlayLineage"/g' vendor/lineage/overlay/rro_packages/NetworkStackOverlay/Android.bp || true
          
          # Kembalikan variabel Hardcode Soong yang sempat hilang!
          sed -i 's/PATH=$(PATH_OVERRIDE_SOONG)//g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(PATH_OVERRIDE_SOONG)//g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(KERNEL_MAKE_CMD)/make/g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(KERNEL_MAKE_FLAGS)//g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(TARGET_KERNEL_SOURCE)/device\/infinix\/X663-kernel/g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(KERNEL_BUILD_OUT_PREFIX)//g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(KERNEL_ARCH)/arm64/g' vendor/crdroid/build/soong/Android.bp || true
          sed -i 's/$(KERNEL_CROSS_COMPILE)//g' vendor/crdroid/build/soong/Android.bp || true
          
          echo "=== FIX ERROR HEALTH AIDL ==="
          # Hapus paksa dependensi baterai yang bikin Soong crash
          sed -i '/health_charging_control_defaults/d' hardware/lineage/interfaces/health/aidl/default/Android.bp || true
          sed -i '/health_charging_control_defaults/d' hardware/lineage/interfaces/health/default/Android.bp || true
          
          echo "=== FIX MISSING WEBVIEW ==="
          rm -rf external/chromium-webview
          git clone --depth=1 -b 12.1 https://github.com/crdroidandroid/android_external_chromium-webview.git external/chromium-webview
          
          echo "=== MEMAKSA MESIN MEMBANGUN OS & IDENTITAS ==="
          sed -i 's/TARGET_SKIP_OTA_PACKAGE := true/TARGET_SKIP_OTA_PACKAGE := false/g' device/infinix/X663/BoardConfig.mk || true
          export TARGET_SKIP_OTA_PACKAGE=false
          export CRDROID_BUILD=X663
          export CRDROID_BUILD_TYPE=UNOFFICIAL
          export CRDROID_MAINTAINER="Rafyal"
          
          echo "=== PERSIAPAN KOMPILASI (ANTI-OOM) ==="
          export MALLOC_ARENA_MAX=2
          export _JAVA_OPTIONS="-Xmx6g"
          
          source build/envsetup.sh
          
          echo "=== EKSEKUSI LUNCH ==="
          lunch crdroid_X663-userdebug
          
          echo "=== MULAI KOMPILASI INTI ==="
          mka bacon -j2

          
      
          
      - name: Upload Output ROM ZIP
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-X663-ROM
          path: ~/crdroid/out/target/product/X663/crDroidAndroid-*.zip
