name: crDroid Build for Infinix Note 11 (X663)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-20.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize & Sync crDroid Source (Android 12)
        run: |
          mkdir -p ~/crdroid
          cd ~/crdroid
          git config --global user.name "Rafyal"
          git config --global user.email "rafyal991@gmail.com"
          # Inisialisasi crDroid cabang 12.1 (Android 12)
          repo init -u https://github.com/crdroidandroid/android.git -b 12.1 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

      - name: Clone Device, Vendor & Kernel Trees
        run: |
          cd ~/crdroid
          # Clone Device Tree
          git clone https://github.com/Rafyal/android_device_infinix_x663.git device/infinix/X663
          # Clone Vendor Tree
          git clone https://github.com/Rafyal/android_vendor_infinix_x663.git vendor/infinix/X663
          # Clone Kernel Tree
          git clone https://github.com/Rafyal/android_kernel_infinix_x663.git device/infinix/X663-kernel

      - name: Build ROM
        run: |
          cd ~/crdroid
          source build/envsetup.sh
          # Memilih target build perangkatmu
          lunch crdroid_X663-userdebug
          # Memulai proses kompilasi crDroid
          mka bacon

      - name: Upload Output ROM ZIP
        uses: actions/upload-artifact@v3
        with:
          name: crDroid-X663-ROM
          path: ~/crdroid/out/target/product/X663/crDroidAndroid-*.zip
